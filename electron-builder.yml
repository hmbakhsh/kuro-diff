appId: com.kuro.diff
productName: kuro-diff
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.prettierrc.yaml,dev-app-update.yml,README.md}'
  - '!docs'
asar: true
asarUnpack:
  - resources/**
afterPack: build/afterPack.cjs
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
    - target: dmg
      arch: [x64]
  # notarize section is set via electron-builder CLI flags in CI so local
  # unsigned builds don't fail fast-forward.
dmg:
  writeUpdateInfo: true
publish:
  provider: github
  releaseType: draft
